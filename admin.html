<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Contact Messages</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:left;
        }

        th{
            background:#111;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

        .delete-btn{
            background:red;
            color:white;
            border:none;
            padding:8px 12px;
            cursor:pointer;
            border-radius:5px;
        }

        .clear-btn{
            margin:20px 0;
            padding:12px 20px;
            background:#ff9800;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .no-data{
            text-align:center;
            margin-top:30px;
            font-size:18px;
            color:gray;
        }
    </style>
</head>

<body>

<h1>Contact Messages</h1>

<button class="clear-btn" onclick="clearMessages()">
    Clear All Messages
</button>

<table id="messageTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Subject</th>
            <th>Message</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="messageBody">

    </tbody>

</table>

<p id="emptyMessage" class="no-data"></p>

<script>

let messages = JSON.parse(localStorage.getItem("contactMessages")) || [];

const tableBody = document.getElementById("messageBody");
const emptyMessage = document.getElementById("emptyMessage");

function loadMessages(){

    tableBody.innerHTML="";

    if(messages.length===0){

        emptyMessage.innerHTML="No Contact Messages Available";
        return;
    }

    emptyMessage.innerHTML="";

    messages.forEach((msg,index)=>{

        tableBody.innerHTML+=`
        <tr>

            <td>${msg.name}</td>
            <td>${msg.email}</td>
            <td>${msg.phone}</td>
            <td>${msg.subject}</td>
            <td>${msg.message}</td>

            <td>
                <button class="delete-btn"
                onclick="deleteMessage(${index})">
                Delete
                </button>
            </td>

        </tr>
        `;
    });

}

function deleteMessage(index){

    messages.splice(index,1);

    localStorage.setItem(
        "contactMessages",
        JSON.stringify(messages)
    );

    loadMessages();

}

function clearMessages(){

    if(confirm("Delete all messages?")){

        localStorage.removeItem("contactMessages");

        messages=[];

        loadMessages();

    }

}

loadMessages();

</script>

</body>
</html>
